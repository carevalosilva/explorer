<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SC Explorer - Política de Privacidad</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.6;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 680px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4),
                        0 0 80px rgba(56, 189, 248, 0.08);
        }

        .icon-wrapper {
            width: 64px;
            height: 64px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
            fill: #38bdf8;
        }

        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
            line-height: 1.4;
            letter-spacing: -0.02em;
        }

        .highlight {
            color: #38bdf8;
        }

        p {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .status-pill {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 14px 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #cbd5e1;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .status-pill svg {
            width: 18px;
            height: 18px;
            fill: #34d399;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Ícono de escudo/seguridad -->
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
            </svg>
        </div>

        <span class="badge">Política de Privacidad</span>

        <!-- Texto principal en varias líneas -->
        <h1>
            <span class="highlight">SC Explorer</span> no recopila, almacena<br>
            ni transmite ningún tipo de información<br>
            personal ni de navegación.
        </h1>

        <!-- Subtexto secundario -->
        <p>
            Todas las capturas se procesan de forma<br>
            local en el dispositivo del usuario.
        </p>

        <!-- Etiqueta de confirmación -->
        <div class="status-pill">
            <svg viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
            </svg>
            <span>Procesamiento 100% Local</span>
        </div>
    </div>

</body>
</html>
